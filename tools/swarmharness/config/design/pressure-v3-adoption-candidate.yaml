campaign_policies:
  exploration-yggterm-mackvm:
    allocation:
      budget_ref: b-exploration
      editor_review_reserve:
        tokens: 200000
      maintenance_reserve_is_spendable: false
      reserve_per_direction:
        tokens: 400000
    authorization:
      scope:
        campaign_refs:
        - yggterm
        - mackvm
      source_ref: owner-directive-2026-10-25
      valid_until: null
    directions:
      max_active: 3
      max_waves: 4
      require_distinct_question: true
      require_evidence_deliverable: true
    editor:
      authority: owner
      role_ref: editor
    mode: directed_multi_direction
    review:
      dispositions:
      - continue
      - deepen
      - fork
      - merge_findings
      - stop
      triggers:
      - wave_complete
      - budget_threshold
      - material_discovery
    stop_conditions:
    - hard_budget_exhausted
    - authority_expired
    - no_eligible_capacity
    - owner_stop
catalog:
  accounts:
    google-bundled:
      credential_ref: keyring/agy-jio
      permitted_hosts:
      - dev
      - jojo
      provider: google
    openai-sol:
      credential_ref: keyring/codex-primary
      permitted_hosts:
      - dev
      - jojo
      provider: openai
    zai-primary:
      credential_ref: keyring/zai-coding-plan
      permitted_hosts:
      - dev
      - jojo
      provider: zai
  bindings:
    autoclaw-chat:
      capabilities:
      - execution
      - dreamer
      harness: autoclaw
      note: BUG-005 fixed 2026-10-25 by the owning agent; plan stable fleet-wide
      provider: zai
      status: declared
    gemini-reviewer:
      account: google-bundled
      capabilities:
      - review
      - knowledge
      - creativity
      harness: agy
      model: gemini-3.8-flash
      plan: gemini-bundled
      provider: google
      reasoning: high
      status: admitted
      task_restrictions: []
    glm-offpeak:
      account: zai-primary
      capabilities:
      - implementation
      - execution
      - dreamer
      harness: zcode-tui
      model: GLM-5.3-Flash
      plan: zai-offpeak
      provider: zai
      reasoning: high
      status: admitted
      task_restrictions:
      - offpeak-only
    glm-workhorse:
      account: zai-primary
      capabilities:
      - implementation
      - execution
      - maintenance
      - dreamer
      harness: zcode-tui
      model: GLM-5.3-Flash
      note: the agentic workhorse; peak window Mon-Fri 11:30-15:30 IST [owner-edit-capture-test
        2026-10-25]
      plan: zai-coding-plan
      provider: zai
      reasoning: max
      status: admitted
      task_restrictions: []
    kimi-editor:
      capabilities:
      - editorial
      note: 'logical editor profile ONLY (sol turn-5): exact harness/provider/model/account/metering
        unverified; cannot receive work until admitted'
      status: declared
    opencode-free-dreamer:
      capabilities:
      - dreamer
      harness: opencode
      note: free-tier quota exhausted 2026-10-23; remedy pending
      provider: opencode
      status: declared
    sol-editor:
      account: openai-sol
      capabilities:
      - editorial
      - review
      - architecture
      - planning
      harness: codex
      model: gpt-6.1-sol
      plan: openai-paid
      provider: openai
      reasoning: high
      status: admitted
      task_restrictions: []
  execution_profiles:
    gemini-high:
      binding_ref: gemini-reviewer
      default_for_binding: true
      reasoning_override: high
    glm-max:
      binding_ref: glm-workhorse
      default_for_binding: true
      reasoning_override: max
    sol-high:
      binding_ref: sol-editor
      default_for_binding: true
      reasoning_override: high
    sol-medium:
      binding_ref: sol-editor
      default_for_binding: false
      reasoning_override: medium
  harnesses:
    agy:
      adapter_ref: consult-agy-v1
      kind: consult-cli
    autoclaw:
      adapter_ref: autoclaw-managed-plane-v1
      kind: desktop-chat
    codex:
      adapter_ref: consult-codex-v1
      kind: consult-cli
    deterministic-python:
      adapter_ref: none
      kind: none
    opencode:
      adapter_ref: opencode-cli-v1
      kind: dreamer-cli
    zcode-tui:
      adapter_ref: queue-serve-v2
      kind: dispatch-queue
  plans:
    autoclaw-legacy:
      account: zai-primary
      kind: managed-plane
      metering_source: unmeasured
      provider: zai
      quota_dimensions:
      - tokens
    gemini-bundled:
      account: google-bundled
      kind: subscription
      metering_source: unmeasured
      provider: google
      quota_dimensions:
      - requests
    openai-paid:
      account: openai-sol
      kind: subscription
      metering_source: measured-local
      provider: openai
      quota_dimensions:
      - requests
    opencode-free:
      kind: free-tier
      metering_source: unmeasured
      provider: opencode
      quota_dimensions:
      - requests
    zai-coding-plan:
      account: zai-primary
      kind: subscription
      metering_source: measured-local
      provider: zai
      quota_dimensions:
      - requests
      - tokens
    zai-offpeak:
      account: zai-primary
      kind: privilege
      metering_source: measured-local
      provider: zai
      quota_dimensions:
      - requests
  providers:
    google:
      id: google
    moonshot:
      id: moonshot
    openai:
      id: openai
    opencode:
      id: opencode
    zai:
      id: zai
editor_scenarios:
  re-editor-blocked:
    activation:
      authority_ref: owner
      max_swaps_per_incident: 1
      requires_admitted_target: true
      ttl_seconds: 3600
    binding_order:
    - kimi-editor
    - sol-editor
    handover_contract_ref: editorial-handover-v1
    on_no_eligible_editor: retain-work-and-defer-editorial-decisions
    permitted_trigger_classes:
    - owner_selection
    - confirmed_editor_classification_block
    scope:
      campaign_refs:
      - reverse-eng
      - bookshelf
      task_classes:
      - reverse_engineering
fleet:
  authority_host: dev
  dispatch_host: dev
  failover: owner-authorized-epoch-transfer
  hosts:
  - dev
  - oc
  - jojo
  - practice
identity:
  authority_epoch: 1
  change_id: 99e3b754-daf3-4e59-974c-048f31dbfb47
  config_id: fleet-swarm
  parent_hash: 5fd4d1d6780915987ce895d2ca9bad2ab2515240b5fbbd3af69d50cde217732d
  proposed_by: owner
  reason: 'owner directive 2026-10-25: BUG-005 fixed, re-enable autoclaw-chat (rebased)'
  revision: 4
intent:
  authority_class: owner
  canonical: ~/git/journal-papers/swarm-harness2/00-intent.md
  hash: null
  hub_door: owner-model-portfolio-intent
  kasten_ref: null
  registry_ref: ~/.yggterm/swarm/registry
  research: ~/git/journal-papers/swarm-harness2
  revision: 5
kernel:
  contract_version: '2.0'
  dream_state_dir: ~/.yggterm/dream
  feedback: ~/.yggterm/dream/audit-feedback.json
  minimum_consumer_version: '2.0'
  on_no_usable_config: containment-only
  policy_dir: ~/.yggterm/dream/policy
  repo: ~/gh/yggterm
  state_dir: ~/.yggterm/swarm
  wake_interval_min: 20
maintenance:
  executor_service: ygg-swarm-executor@zcode.service
  permitted_actions:
  - validate-config
  - replicate-accepted-config
  - capture-replica-proposal
  - restart-allowlisted-unit
  - contain-ineligible-work
  - invoke-versioned-recovery-procedure
  - launch-authorized-repair-role
  prohibited_actions:
  - invent-owner-policy
  - increase-budget
  - redeem-banked-reset
  - purchase-credit
  - change-credentials
  - install-unreviewed-code
  - promote-generated-procedure
  - clear-deny-latch-without-owner
  repair_role_ref: core-keeper
  service: ygg-swarm-maintenance-orchestrator.service
  supervisor:
    backoff_seconds:
    - 10
    - 60
    - 300
    controller_host: dev
    dependency_timeout_seconds: 30
    harness: deterministic-python
    model: null
    poll_seconds: 30
    replica_hosts:
    - oc
    - jojo
    - practice
    restart_limit:
      attempts: 3
      window_seconds: 900
planes:
  autoclaw-chat:
    allowed_task_classes:
    - dreamer
    binding_refs:
    - autoclaw-chat
    budget_refs:
    - b-autoclaw-daily
    health_contract:
      source_ref: autoclaw-probe
      ttl_seconds: 300
    note: re-enabled by owner directive 2026-10-25 (BUG-005 fixed by the owning agent;
      plan stable fleet-wide)
    owner_policy: enabled
  intelligence-consult:
    allowed_task_classes:
    - editorial
    - review
    binding_refs:
    - sol-editor
    - gemini-reviewer
    budget_refs:
    - b-consult-daily
    health_contract:
      source_ref: consult-probe
      ttl_seconds: 900
    owner_policy: enabled
  opencode-free:
    allowed_task_classes:
    - dreamer
    binding_refs:
    - opencode-free-dreamer
    budget_refs:
    - b-opencode-daily
    health_contract:
      source_ref: opencode-probe
      ttl_seconds: 600
    note: free-tier quota exhausted 2026-10-23; remedy pending
    owner_policy: disabled
  zai-offpeak:
    allowed_task_classes:
    - implementation
    - execution
    - dreamer
    binding_refs:
    - glm-offpeak
    budget_refs:
    - b-offpeak-daily
    health_contract:
      source_ref: queue-route-health
      ttl_seconds: 300
    owner_policy: enabled
  zai-peak:
    allowed_task_classes:
    - implementation
    - execution
    - maintenance
    - dreamer
    binding_refs:
    - glm-workhorse
    budget_refs:
    - b-workhorse-daily
    health_contract:
      source_ref: queue-route-health
      ttl_seconds: 300
    owner_policy: enabled
roles:
  core-keeper:
    binding_refs:
    - glm-workhorse
    escalation: owner
    heartbeat_seconds: 60
    kind: model-assisted-maintenance
    lease_seconds: 1800
    max_attempts_per_incident: 3
    reserve_ref: maintenance-reserve
  core-maintenance:
    kind: deterministic
    model: null
    supervisor_ref: maintenance.supervisor
  dreamers:
    kind: execution
    profiles:
      ux_parity:
        binding_ref: glm-workhorse
        max_attempts: 3
        prompt_file: ~/.yggterm/config/dream/ux-parity-prompt.md
        workspace: ~/gh/zcode-tui--ux-sol-2
  editor:
    authority_ref: owner
    default_binding_ref: sol-editor
    fallback_binding_refs:
    - kimi-editor
    kind: editorial
    routing:
      fallback_profile_refs:
      - kimi-editor/default
      max_concurrent_slots: 16
      parallel:
        lanes: []
        strategy: single
      preferred_profile_ref: sol-high
    scenario_policy_ref: editor_scenarios
  intelligence:
    binding_refs:
    - sol-editor
    - gemini-reviewer
    default_binding_ref: sol-editor
    fallback_binding_refs:
    - gemini-reviewer
    kind: proposal-and-review
    rhythms:
      decision_consults: on-novel-evidence
      editorial_review: daily-when-material
    routing:
      fallback_profile_refs:
      - gemini-high
      max_concurrent_slots: 96
      parallel:
        lanes:
        - profile_ref: sol-high
          weight: 1
        - profile_ref: sol-medium
          weight: 2
        strategy: weighted_fair
      preferred_profile_ref: sol-high
    triggers:
    - materially-new-evidence
    - scheduled-material-review
schema_version: 3
supply:
  budgets:
    b-autoclaw-daily:
      hard_limits:
        tokens: 200000
      scope: plane/autoclaw-chat
      window_hours: 24
    b-consult-daily:
      hard_limits:
        consults: 4096
      scope: plane/intelligence-consult
      window_hours: 24
    b-exploration:
      hard_limits:
        tokens: 6000000
      scope: campaign/yggterm+mackvm
      window_hours: 168
    b-offpeak-daily:
      hard_limits:
        tokens: 1500000
      scope: plane/zai-offpeak
      window_hours: 24
    b-opencode-daily:
      hard_limits:
        tokens: 100000
      scope: plane/opencode-free
      window_hours: 24
    b-workhorse-daily:
      hard_limits:
        tokens: 4000000
      scope: plane/zai-peak
      window_hours: 24
    maintenance-reserve:
      hard_limits:
        tokens: 200000
      note: protected — never spent to keep exploration or dreams alive
      scope: maintenance
      spendable: false
      window_hours: 168
  maintenance_reserve_ref: maintenance-reserve
  namespaces_ref: ~/.yggterm/config/dream/floors.json
  pressure:
    ceilings:
      binding_concurrent_slots:
        gemini-reviewer: 4
        glm-workhorse: 8
        sol-editor: 96
      default_binding_concurrent_slots: 1
      default_profile_concurrent_slots: 1
      global_concurrent_slots: 128
      pools:
        codex-sol:
          binding_refs:
          - sol-editor
          concurrent_slots: 96
          cooldown_after_refusal_seconds: 60
        gemini-consult:
          binding_refs:
          - gemini-reviewer
          concurrent_slots: 4
          cooldown_after_refusal_seconds: 60
        zai-shared:
          binding_refs:
          - glm-workhorse
          - glm-offpeak
          concurrent_slots: 8
          cooldown_after_refusal_seconds: 60
      profile_concurrent_slots:
        gemini-high: 4
        glm-max: 8
        sol-high: 32
        sol-medium: 64
    control:
      agent_level_names:
      - normal
      - high
      - saturate
      agent_profile_refs:
      - sol-high
      - sol-medium
      - gemini-high
      - glm-max
      agent_role_refs:
      - editor
      - intelligence
      - dreamers
      - core-keeper
      lease_max_active_per_issuer: 1
      lease_max_ttl_seconds: 900
      persistent_agent_edits: true
    demand:
      level: high
      profile_slot_overrides: {}
    levels:
      high:
        default_profile_slots: 1
        profile_slots:
          gemini-high: 2
          glm-max: 6
          sol-high: 16
          sol-medium: 32
      normal:
        default_profile_slots: 1
        profile_slots:
          gemini-high: 1
          glm-max: 2
          sol-high: 2
          sol-medium: 4
      saturate:
        default_profile_slots: 1
        profile_slots:
          gemini-high: 4
          glm-max: 8
          sol-high: 32
          sol-medium: 64
  retry_policy:
    defer_minutes: 45
    max_attempts: 3
    timeout_seconds: 2700
  schedules:
    peak_window: Mon-Fri 11:30-15:30 IST
    wake_interval_min: 20
sync:
  activation_ack_consumers:
  - dream-orchestrator
  - spawner-timer
  - audit-timer
  - executor-adapter
  disconnected_dispatch: deny
  protocol_version: 1
  reconcile_seconds: 300
  require_receiver_validation: true
  transport_adapter_ref: swarm-ledger-v1
