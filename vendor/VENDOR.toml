# WHERE EACH VENDORED CRATE CAME FROM.
#
# Without this record our own patch set is uncomputable and every upgrade is
# archaeology — which is exactly the state the fork was in until 2026-08-01.
# `docs/vendor-upgrade-path.md` is the procedure; this is the data it needs.
#
# `version` is the PRISTINE upstream release we forked FROM, not the version we
# claim to be. Fetch it with:
#   curl -sL https://static.crates.io/crates/<n>/<n>-<version>.crate | tar xz
#
# `inline_files`  = upstream files we EDIT. Every one is a future merge conflict.
# `additive_files` = files that exist only in our tree. Zero upgrade cost.
# ⭐ Moving work from the first list to the second is the whole strategy.

[wry]
upstream = "https://github.com/tauri-apps/wry"
version = "0.56.1"
inline_files = [
  "src/inject_initialization_scripts.rs",
  "src/lib.rs",
  "src/web_context.rs",
  "src/webkitgtk/mod.rs",
  "src/webkitgtk/synthetic_mouse_events.rs",
  "src/webkitgtk/web_context.rs",
  "src/webview2/mod.rs",
  "src/wkwebview/class/wry_web_view_ui_delegate.rs",
]
additive_files = []

[dioxus-desktop]
upstream = "https://github.com/DioxusLabs/dioxus"
version = "0.7.9"
inline_files = [
  "src/app.rs",
  "src/desktop_context.rs",
  "src/edits.rs",
  "src/ipc.rs",
  "src/js/native_eval.js",
  "src/launch.rs",
  "src/lib.rs",
  "src/mobile.rs",
  "src/protocol.rs",
  "src/webview.rs",
]
additive_files = [
  "src/web_surface.rs",
  "src/web_surface_clipboard_image_paste.rs",
  "src/web_surface_media_trace.rs",
]
# 0.7.10 was evaluated 2026-09-04 and NOT taken: it is source-identical to
# 0.7.9 — its only deltas are its own version bump, Cargo.lock churn, and a
# wry requirement DOWNGRADE to ^0.53.5 (upstream 0.8.0-alpha pairs wry ^0.55.1).
# We keep the 0.7.9 source with our own wry 0.56.1 pairing; the wry version
# requirement in our vendored Cargo.toml is an inline edit of ours.
# Also inline-edited (recorded 2026-09-04, drift caught by §4.1): the
# [dependencies.wry] version requirement and the wry feature passthroughs
# ("protocol" removed upstream in 0.56; "fullscreen"/"transparent" now
# unconditional, dioxus-desktop's own features of those names kept as no-ops).

[dioxus-interpreter-js]
upstream = "https://github.com/DioxusLabs/dioxus"
version = "0.7.9"
inline_files = [
  "src/ts/native.ts",
  "src/js/native.js",
]
additive_files = []
# The inline edit is the edit-batch flush backstop (EDITS_FLUSH_FALLBACK_MS,
# editFault reporting, one-bad-buffer-must-not-eat-siblings with stack-depth
# restore). native.js is the build-generated binding of native.ts — edit the
# .ts, then let build.rs regenerate. src/js/hash.txt is lazy-js_bundle's
# DERIVED hash state, committed upstream; it changes with native.js and is
# not an edit of ours. 0.7.10 was evaluated 2026-09-04 and NOT taken:
# source-identical to 0.7.9 (version bump + wry-pin churn only).
