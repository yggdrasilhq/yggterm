<!doctype html>
<html><head><meta charset="utf-8"><title>FIXTURE-INTERACTIVE</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#ff0000}</style>
</head><body>
<script>
// Colour IS the readback channel: the spike asserts on pixels, so the page must
// say what happened in pixels. No DOM inspection, no JS bridge — the only way
// these fire is a real input event travelling the real input path.
document.addEventListener('pointerdown', function () {
  document.body.style.background = '#00ff00';   // green = a click landed
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'x') {
    document.body.style.background = '#0000ff'; // blue = a keystroke landed
  }
});
</script>
</body></html>
