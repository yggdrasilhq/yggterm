[package]
name = "yggterm-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"

[features]
default = []
ghostty-ffi = ["yggterm-ghostty-bridge/ghostty-ffi"]
# Cross-crate test doors only (see `remember_live_row_close_for_test`). Turned on
# by a `[dev-dependencies]` edge, so it is absent from every shipping binary.
test-support = []

[dependencies]
anyhow.workspace = true
base64 = "0.22"
dirs.workspace = true
libc = "0.2"
png = "0.18"
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
shlex = "1"
time.workspace = true
tracing.workspace = true
rusqlite = { version = "0.39.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"
yggui-contract = { path = "../yggui-contract" }
yggterm-core = { path = "../yggterm-core" }
yggterm-ghostty-bridge = { path = "../yggterm-ghostty-bridge", default-features = false }
yggterm-gtk-glue = { path = "../yggterm-gtk-glue" }
yggterm-platform = { path = "../yggterm-platform" }
