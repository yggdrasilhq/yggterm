[package]
name = "ynpm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Package-management plumbing, exposed through `ygg ynpm` in the 4.0
# porcelain contract. The component remains independently runnable for
# bootstrap/compatibility and must not require a daemon or GUI. Component
# ownership/generations stay here; the porcelain must not duplicate them.
[[bin]]
name = "ynpm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
yggterm-core = { path = "../yggterm-core" }
