[workspace]
members = [
  "apps/yggterm",
  "crates/yggui-contract",
  "crates/yggterm-core",
  "crates/yggterm-server",
  "crates/yggui",
  "crates/yggterm-shell",
  "crates/yggterm-webprobe",
  "crates/yggterm-gtk-glue",
  "crates/yggterm-platform",
  "crates/yggterm-ghostty-bridge",
  "crates/emd-renderer",
  # ⛔ A LOCK THAT NEVER RUNS IS NOT A LOCK. This vendored crate holds 67
  # tests — 64 of them in web_surface.rs, covering the adblock content-filter
  # FFI, under-glass restacking, the find controller and the seat observer —
  # and for as long as it was only a `[patch.crates-io]` path dependency,
  # `cargo test` at the root never ran a single one of them. CI never named
  # them either (it names individual tests in the other crates, one per line).
  # Caught 2026-07-31 by the clipboard-image-paste lane, whose predecessor
  # lock `every_page_surface_is_built_able_to_paste` had been green for weeks
  # while being structurally incapable of failing.
  "vendor/dioxus-desktop",
]
resolver = "2"

[workspace.package]
version = "2.12.19"
edition = "2024"
authors = ["Yggdrasil HQ"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "6"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }
dioxus-interpreter-js = { path = "vendor/dioxus-interpreter-js" }
wry = { path = "vendor/wry" }
