[workspace]
members = [
  "apps/yggterm",
  "crates/yggterm-core",
  "crates/yggterm-server",
  "crates/yggterm-shell",
  "crates/yggterm-webprobe",
  "crates/yggterm-gtk-glue",
  "crates/yggterm-platform",
  "crates/yggterm-ghostty-bridge",
  # ⛔ A LOCK THAT NEVER RUNS IS NOT A LOCK. This vendored crate holds 67
  # tests — 64 of them in web_surface.rs, covering the adblock content-filter
  # FFI, under-glass restacking, the find controller and the seat observer —
  # and for as long as it was only a `[patch.crates-io]` path dependency,
  # `cargo test` at the root never ran a single one of them. CI never named
  # them either (it names individual tests in the other crates, one per line).
  # Caught 2026-07-31 by the clipboard-image-paste lane, whose predecessor
  # lock `every_page_surface_is_built_able_to_paste` had been green for weeks
  # while being structurally incapable of failing.
  "vendor/dioxus-desktop",
]
resolver = "2"

[workspace.package]
version = "3.0.28"
edition = "2024"
authors = ["Yggdrasil HQ"]
# One owner for the licence. Members inherit with `license.workspace = true`;
# the only manifests that state their own are the vendored third-party crates,
# which keep their upstream terms, and the deliberately-detached ones.
license = "GPL-3.0-or-later"

[workspace.dependencies]
# libyggterm — extracted 2026-08-02, MPL-2.0. Pinned to a tag so a clean clone
# of yggterm always builds; bump the tag here and nowhere else. For working on
# both trees at once, use a local [patch] in .cargo/config.toml (git-ignored) —
# never commit a path override, that is how a repo stops building from a clone.
#
# ⛔ ONE libyggterm version, never two. Every crate below moves to the same tag
# in the same edit: two tags would resolve to two copies of `yggui-contract`,
# and the types an app and its host exchange would stop being the same types.
yggui = { git = "https://github.com/yggdrasilhq/libyggterm", tag = "v0.9.0" }
yggui-contract = { git = "https://github.com/yggdrasilhq/libyggterm", tag = "v0.9.0" }
# emd (extended markdown) — the document model + parser. Left this tree for
# libyggterm on 2026-08-02 and is MPL-2.0 there: it is the document engine of
# the app pipeline (yedit, ztlkasten, breezed, charts-webapp), and a library apps
# must LINK is MPL by the licence-by-role rule. Spec lives with the crate.
emd-renderer = { git = "https://github.com/yggdrasilhq/libyggterm", tag = "v0.9.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "6"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }
dioxus-interpreter-js = { path = "vendor/dioxus-interpreter-js" }
wry = { path = "vendor/wry" }
